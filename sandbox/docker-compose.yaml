services:
    wallet-mysql:
        image: mysql:8.0
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: wallet
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - wallet-mysql-data:/var/lib/mysql
            - ./create-wallet-tables.sql:/docker-entrypoint-initdb.d/create-wallet-tables.sql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10
        restart: always

    wallet-kurrentdb:
        image: kurrentplatform/kurrentdb:latest
        ports:
            - "2113:2113"
            - "1113:1113"
        environment:
            # Required for development, runs in insecure mode without SSL
            - EVENTSTORE_INSECURE=true
            - EVENTSTORE_RUN_PROJECTIONS=All
            - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
        volumes:
            - wallet-kurrentdb-data:/var/lib/eventstore
            - wallet-kurrentdb-logs:/var/log/eventstore
        restart: always

volumes:
    wallet-mysql-data:
    wallet-kurrentdb-data:
    wallet-kurrentdb-logs:
