services:
    wallet-mysql:
        image: mysql:8.0
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: wallet
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - wallet-mysql-data:/var/lib/mysql
            - ./create-wallet-tables-mysql.sql:/docker-entrypoint-initdb.d/create-wallet-tables-mysql.sql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10
        restart: always
        networks:
            - wallet-network

    wallet-postgresql:
        image: postgres:17
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: wallet
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        volumes:
            - wallet-postgresql-data:/var/lib/postgresql/data
            - ./create-wallet-tables-postgresql.sql:/docker-entrypoint-initdb.d/create-wallet-tables-postgresql.sql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "root", "-d", "wallet"]
            timeout: 20s
            retries: 10
        restart: always
        networks:
            - wallet-network

    wallet-kurrentdb:
        image: kurrentplatform/kurrentdb:latest
        ports:
            - "2113:2113"
            - "1113:1113"
        environment:
            # Required for development, runs in insecure mode without SSL
            - EVENTSTORE_INSECURE=true
            - EVENTSTORE_RUN_PROJECTIONS=All
            - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
        volumes:
            - wallet-kurrentdb-data:/var/lib/eventstore
            - wallet-kurrentdb-logs:/var/log/eventstore
        restart: always
        networks:
            - wallet-network

volumes:
    wallet-mysql-data:
    wallet-postgresql-data:
    wallet-kurrentdb-data:
    wallet-kurrentdb-logs:

networks:
    wallet-network:
        driver: bridge
