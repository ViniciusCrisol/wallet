version: 2

models:
    - name: mart_transfers
      description: "Transfer history enriched with balance before and after each transfer"
      columns:
          - name: wallet_id
            description: "UUID of the wallet"
            data_tests:
                - not_null
          - name: transfer_id
            description: "UUID of the transfer"
            data_tests:
                - not_null
          - name: counterpart_wallet_id
            description: "UUID of the other wallet involved in the transfer"
            data_tests:
                - not_null
          - name: direction
            description: "Direction of the transfer: 'incoming' or 'outgoing'"
            data_tests:
                - not_null
                - accepted_values:
                      arguments:
                          values: [incoming, outgoing]
          - name: category
            description: "Category of the transfer"
            data_tests:
                - not_null
          - name: amount_in_cents
            description: "Absolute amount transferred in cents"
            data_tests:
                - not_null
          - name: balance_before_in_cents
            description: "Wallet balance in cents immediately before this transfer"
            data_tests:
                - not_null
          - name: balance_after_in_cents
            description: "Wallet balance in cents immediately after this transfer"
            data_tests:
                - not_null
          - name: transferred_at
            description: "Timestamp when the transfer occurred"
            data_tests:
                - not_null

    - name: mart_wallets
      description: "Wallet summary with aggregated transfer statistics and activity status"
      columns:
          - name: wallet_id
            description: "UUID of the wallet"
            data_tests:
                - not_null
                - unique
          - name: holder_id
            description: "UUID of the wallet holder"
            data_tests:
                - not_null
          - name: balance_in_cents
            description: "Current balance in cents"
            data_tests:
                - not_null
          - name: favorite_category
            description: "Most frequently used transfer category for this wallet"
          - name: status
            description: "Activity status: 'active' if last transfer or creation was within 90 days, otherwise 'suspended'"
            data_tests:
                - not_null
                - accepted_values:
                      arguments:
                          values: [active, suspended]
          - name: last_transfer_at
            description: "Timestamp of the most recent transfer"
          - name: total_transfers
            description: "Total number of transfers for this wallet"
            data_tests:
                - not_null
          - name: transfers_last_30_days
            description: "Number of transfers in the last 30 days"
            data_tests:
                - not_null
          - name: transfers_last_90_days
            description: "Number of transfers in the last 90 days"
            data_tests:
                - not_null
          - name: largest_transfer_in_cents
            description: "Largest single transfer amount in cents"
            data_tests:
                - not_null
          - name: total_transferred_amount_in_cents
            description: "Sum of all transfer amounts in cents"
            data_tests:
                - not_null
          - name: created_at
            description: "Timestamp when the wallet was created"
            data_tests:
                - not_null
          - name: updated_at
            description: "Timestamp of the last state update"
            data_tests:
                - not_null
