info:
    name: Create wallet
    type: http
    seq: 1

http:
    method: post
    url: http://localhost:8080/wallets
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "wallet_id": "11111111-1111-1111-1111-111111111111",
              "holder_id": "22222222-2222-2222-2222-222222222222"
            }
    auth: inherit

settings:
    encodeUrl: false
    timeout: 0
    followRedirects: true
    maxRedirects: 5
